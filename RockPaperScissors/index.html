<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="img">
            <img src="images/title.png" alt="title">
        </div>
        <div id="title">
            <h1>
                <span id="p1">Rock </span>
                <span id="p2">Paper </span>
                <span id="p3">Scissors </span>
                <span id="p4">Game</span>
            </h1>
        </div>
    </header>
    <main class="main">
        <div id="m1">
            <h3>Rock&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Paper &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Scissors</h3>
        </div>
        <div class="actionImages">
             <img src="images/rock.png" alt="rock image">
             <img src="images/paper.png" alt="paper image">
             <img src="images/scissors.png" alt="scissorsimage">
        </div>
    </main>
    
</body>
</html>
