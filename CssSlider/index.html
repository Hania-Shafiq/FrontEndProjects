<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Change the CSS of below image by help of sliders.</h1>
        <span class="heading">Javascript</span>
        <div class="css-controller">
            <label for="base">Base Color</label>
            <input type="color" name="base" id="base" value="#5499c7">

            <label for="width">Width</label>
            <input type="range" id="width" name="width" value="30" min="0" max="100" data-sizing="%">

            <label for="border-radius">Border Radius</label>
            <input type="range" id="border-radius" name="border-radius" value="50" min="0" max="100" data-sizing="px">

            <label for="padding">Padding</label>
            <input type="range" id="padding" name="padding" value="10" min="0" max="200" data-sizing="px">

            <label for="blur">Blur</label>
            <input type="range" id="blur" name="blur" value="0" min="0" max="25" data-sizing="px">
        </div>
        <img src="images/img.jpg" alt="Sample" width="27%" height="auto">
    </div>
    <script src="script.js"></script>
</body>
</html>
