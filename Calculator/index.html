<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/title.png" type="image/png">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro-screen" id="intro-screen">
        <img id="intro-img" src="images/display.png">
    </div>
    <h1 id="title">(Calculator)</h1>
    <br>
    <div id="grid-container">
        <div class="grid-item" onclick="appendNumber(1)">1</div>
        <div class="grid-item" onclick="appendNumber(2)">2</div>
        <div class="grid-item" onclick="appendNumber(3)">3</div>
        <div class="grid-item-o" onclick="appendOperator('+')">+</div>
        
        <div class="grid-item" onclick="appendNumber(4)">4</div>
        <div class="grid-item" onclick="appendNumber(5)">5</div>
        <div class="grid-item" onclick="appendNumber(6)">6</div>
        <div class="grid-item-o" onclick="appendOperator('-')">-</div>
        
        <div class="grid-item" onclick="appendNumber(7)">7</div>
        <div class="grid-item" onclick="appendNumber(8)">8</div>
        <div class="grid-item" onclick="appendNumber(9)">9</div>
        <div class="grid-item-o" onclick="appendOperator('X')">X</div>
        
        <div class="grid-item-o" onclick="appendNumber('.')">.</div>
        <div class="grid-item" onclick="appendNumber(0)">0</div>
        <div class="grid-item-o" onclick="appendOperator('/')">/</div>
        <div class="grid-item-o" onclick="calculate()">=</div>

        <div class="grid-item-o" ></div>
        <div class="grid-item-o" onclick="clearDisplay()">C</div>
        <div class="grid-item-o" onclick="deleteLast()">Del</div>
        <div class="grid-item-o" ></div>
    </div>
    <br>
    <div id="result"> </div>
    <script src="script.js"></script>
</body>
</html>
