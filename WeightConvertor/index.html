<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Convertor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="">
            <h1>Weight Convertor</h1>
            <p>You can convert your WEIGHT from kilograms to Pounds here.</p>
            <label for="weight-convertor">Kilograms:</label>
            <input type="text" step="5" placeholder="Enter your weight in KGs: ">
        </form><p>Your weight in POUNDS is:<br>
             <span id="convertedWeight"></span>
            </p>

    </div>
   <script src="script.js"></script> 
</body>
</html>
