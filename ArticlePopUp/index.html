<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Article Pop Up</title>
</head>
<body>
    <a class="button" onclick="toggleNewsLetter()">Subscribe Us</a>
    <div id="newsLetter">
        <h1>I am Hania Shafiq.</h1>
        <p>Its a practice newsletter pop-up</p>
    <div class="box">
        <input type="email" placeholder="Enter Email Here">
    </div class="box">
    <button type="submit">Sign Up</button>
    <div class="close" onclick="toggleNewsLetter()">
        <i class="fa-solid fa-x" aria-hidden="true" style="color: #000000;"></i>
    </div>
</div>
<script src="script.js"> </script>
</body>
</html>
